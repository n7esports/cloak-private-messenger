name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  footer-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/check-footer-links.js
